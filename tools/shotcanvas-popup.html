<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<title>App Store shot — toolbar popup</title>
<link rel="stylesheet" href="shotcanvas.css">
<!--
  App Store screenshot canvas: the toolbar popup, hanging off a rebuilt Safari
  toolbar over a generated wallpaper. Rendered by REAL SAFARI via
  tools/make-shots.sh, so every control below — buttons, the number stepper,
  the focus ring on the autofocused button — is drawn by WebKit itself from
  the extension's own stylesheet. Nothing here styles a control.

  The popup is extension/popup.html's markup and CSS, re-rendered at final
  size rather than enlarged from a capture. The toolbar icon is the real icon
  file, so it cannot drift from the shipped release. Only the state sentence
  is hand-written — it comes from popup.js talking to Safari's tab API, which
  cannot run here; keep it in step with render() in extension/popup.js.
-->
<style>
  /* The design grid is 576x360; zoom 5 lays it out at 2880x1800 CSS px,
     which on a 1x display is 2880x1800 device px — the App Store slot.
     Every coordinate below is in the 576x360 space. */
  .frame {
    width: 576px;
    height: 360px;
    zoom: 5;
  }
  .toolbar { height: 46px; }
  .toolbar .spacer { flex: .6; }
  .toolbar .pill { flex: 1; }

  /* Anchored under the toolbar button, the way Safari drops a popover. The
     pointer is centred on the button (x 269), not on the panel, and clipped
     to the gap between toolbar and panel — it is its own part of the
     popover, and the overlap at its base is the visible seam. */
  .popup {
    position: absolute;
    z-index: 2;
    top: 54px;
    left: 127px;
  }
  .pointer-clip {
    z-index: 3;
    top: 46px;
    left: 257px;
  }

  /* ---- extension/popup.html's own stylesheet, verbatim ---------------- */
  .popup {
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    width: 260px;
    margin: 0;
    padding: 12px;
  }
  .popup h1 { font-size: 14px; margin: 0 0 8px; }
  .popup #state { font-weight: 600; margin: 0 0 10px; }
  .popup #state.active { color: #2e8b57; }
  .popup #state.excluded { color: #b04a4a; }
  .popup button {
    display: block;
    width: 100%;
    padding: 6px;
    margin: 6px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .popup #limit { margin-top: 10px; border-top: 1px solid #8884; padding-top: 8px; }
  .popup #limit label { display: block; font-size: 11px; opacity: .75; margin-bottom: 4px; }
  .popup .row { display: flex; align-items: center; gap: 6px; }
  .popup .row input { width: 56px; padding: 5px; font: inherit; }
  .popup .row button { width: auto; flex: 1; margin: 0; }
  .popup .links { margin-top: 10px; border-top: 1px solid #8884; padding-top: 8px; }
  .popup .links a { display: block; margin: 4px 0; }

  /* ---- the panel macOS draws around it ------------------------------- */
  /* Only the panel: its glass comes from .glass in shotcanvas.css, its text
     colour from the document colour scheme. Controls are Safari's. */
  .popup {
    box-sizing: content-box;
    border-radius: 16px;
    color: CanvasText;
  }

  /* The one control Safari mis-draws under zoom: the native focus ring is
     painted at fixed physical thickness, so at 5x it comes out hairline.
     Replace it with a ring that scales, in the system accent colour Safari
     itself uses. Thickness and stand-off match a real popup capture. */
  #toggle:focus {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="frame">
  <div class="toolbar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="spacer"></div>
    <div class="ext-button"><img src="../extension/images/icon-512.png" alt=""></div>
    <div class="pill">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/>
      </svg>
    </div>
  </div>

  <div class="pointer-clip"><div class="pointer glass"></div></div>

  <!-- extension/popup.html's body, in the state popup.js renders for a site
       carrying a 12-second override. autofocus puts Safari's own focus ring
       on the first button, as a freshly opened popup has. -->
  <div class="popup glass">
    <h1>MediaKeyGuard</h1>
    <p id="state" class="active">Guard active — sounds up to 12s ✅</p>
    <button id="toggle" autofocus>Exclude this site</button>
    <div id="limit">
      <label for="secs">Treat sounds up to this long as notifications:</label>
      <div class="row">
        <input id="secs" type="number" min="1" max="600" step="1" value="12">
        <span>sec</span>
        <button id="apply">Apply</button>
      </div>
      <button id="clear">Back to 5s default</button>
    </div>
    <div class="links">
      <a href="#" id="options">Edit site lists…</a>
      <a href="https://github.com/Streamlining-Life/MediaKeyGuardForSafari#readme">Help / About</a>
    </div>
  </div>
</div>

</body>
</html>
